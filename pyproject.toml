[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-price-predictor"
version = "1.0.0"
description = "Multimodal E-Commerce Product Price Prediction using SigLIP2, MiniLM, and Heterogeneous Ensembles"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Krishna Balaji" }]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "transformers>=4.40.0",
    "sentence-transformers>=2.7.0",
    "Pillow>=9.5.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "lightgbm>=4.3.0",
    "xgboost>=2.0.0",
    "catboost>=1.2.0",
    "streamlit>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
price-predictor = "price_predictor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
